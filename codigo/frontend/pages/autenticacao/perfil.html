<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - SkAI</title>
  <link rel="stylesheet" href="../../css/perfil.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container-perfil">
    <div class="card">
      <h1>PERFIL</h1>

      <!-- Foto de perfil centralizada -->
      <div class="field photo-field">
        <p class="photo-label">Foto:</p>
        <div class="photo-wrapper">
          <img id="avatarImage" src="../../img/avatar-icon.png" alt="Avatar">
          <input type="file" id="avatarInput" accept="image/*" onchange="trocarAvatar(event)">
          <button onclick="document.getElementById('avatarInput').click()">Editar</button>
        </div>
      </div>

      <!-- Campos de texto -->
      <div class="field">
        <label>Nome:</label>
        <div class="input-group">
          <input type="text" id="nome" value="Passageiro" readonly>
          <button onclick="habilitarEdicao('nome')">Editar</button>
        </div>
      </div>

      <div class="field">
        <label>Email:</label>
        <div class="input-group">
          <input type="email" id="email" value="Email do usuário" readonly>
          <button onclick="habilitarEdicao('email')">Editar</button>
        </div>
      </div>

      <div class="field">
        <label>CPF:</label>
        <div class="input-group">
          <input type="text" id="cpf" value="XXX.XXX.XXX-XX" readonly>
          <button onclick="habilitarEdicao('cpf')">Editar</button>
        </div>
      </div>

      <div class="field">
        <label>Data de Nascimento:</label>
        <div class="input-group">
          <input type="text" id="nascimento" value="DD/MM/AA" readonly>
          <button onclick="habilitarEdicao('nascimento')">Editar</button>
        </div>
      </div>

      <!-- Botões de ação -->
      <div class="actions">
        <button class="main-btn" onclick="window.location.href='../historico.html'">MINHAS VIAGENS</button>
        <button class="logout-btn">SAIR</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    function habilitarEdicao(id) {
      const input = document.getElementById(id);
      input.removeAttribute("readonly");
      input.focus();
    }

    function trocarAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("avatarImage").src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
