<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKAI - Atualizar Senha</title>
    <link rel="stylesheet" href="../../css/autenticacao.css">
</head>
<body>
    <div class="login-container">
        <div class="login-title">ATUALIZAR SENHA</div>

        <form id="resetPasswordForm">
            <div class="input-group">
                <label for="novaSenha">Nova Senha:</label>
                <input type="password" id="novaSenha" placeholder="Digite a nova senha" required>
            </div>

            <button type="submit" class="login-button">ATUALIZAR</button>
        </form>

    
    </div>

    <script src="../../js/autenticacao.js"></script>
</body>
</html>
