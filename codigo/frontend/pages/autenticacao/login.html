<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKAI - Login</title>
    <link rel="stylesheet" href="../../css/autenticacao.css">
</head>
<body>
    <div class="login-container">
        <img src="../../img/logo.png" alt="SKAI Logo" class="logo">
        <div class="login-title">LOGIN</div>
       
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Digite o seu email" required>
            </div>
           
            <div class="input-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>
           
            <button type="submit" class="login-button">ENTRAR</button>
        </form>
       
        <div class="social-login">Conecte-se com o</div>
       
        <div class="google-login">
            <img src="../../img/icone-google.png" alt="Google Icon" class="google-icon">
           
        </div>
       
        <div>Não tem conta? <a href="#" class="register-link">Cadastra-se</a></div>
    </div>

    <script src="../../js/script.js"></script>
</body>
</html>
