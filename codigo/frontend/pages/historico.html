<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Compras - SkAI</title>
  <link rel="stylesheet" href="../css/historico.css">
</head>
<body>
  <div class="container-hist">
    <div class="history-box">
      <div class="header">
        <h1>Histórico de Compras</h1>
        <button class="filter-button">Filtrar Compras</button>
        <div class="logo">
          <img src="../img/logoskai.jpg" alt="Logo SkAI">
        </div>
      </div>

      <div class="card">
        <div class="route-date">
          <p><strong>São Paulo ➜ Rio de Janeiro</strong></p>
          <p class="date">15 de abril de 2024</p>
        </div>
        <div class="price-actions">
          <p class="total">Total<br><strong>R$ 259,90</strong></p>
          <button class="details-button">Ver detalhes</button>
          <button class="download-button">Baixar comprovante</button>
        </div>
      </div>

      <div class="card">
        <div class="route-date">
          <p><strong>São Luís ➜ Rio de Janeiro</strong></p>
          <p class="date">16 de dezembro de 2024</p>
        </div>
        <div class="price-actions">
          <p class="total">Total<br><strong>R$ 330,95</strong></p>
          <button class="details-button">Ver detalhes</button>
          <button class="download-button">Baixar comprovante</button>
        </div>
      </div>

      <div class="card">
        <div class="route-date">
          <p><strong>Recife ➜ Buenos Aires</strong></p>
          <p class="date">30 de outubro de 2024</p>
        </div>
        <div class="price-actions">
          <p class="total">Total<br><strong>R$ 784,90</strong></p>
          <button class="details-button">Ver detalhes</button>
          <button class="download-button">Baixar comprovante</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
