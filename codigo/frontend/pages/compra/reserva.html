<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Passagem - SkAI</title>
  <link rel="stylesheet" href="../../css/reserva.css">
</head>
<body>
  <div class="container-reserva">
    
    <div class="etapas">
      <span class="etapa ativa">1. Escolha do voo</span>
      <span class="etapa ativa">→ 2. Reserva</span>
      <span class="etapa">→ 3. Pagamento</span>
    </div>

    <header>
      <h1>Reserva de Passagem</h1>
    </header>

    <div class="dados-voo">
      <p><strong>Origem:</strong> São Paulo</p>
      <p><strong>Destino:</strong> Rio de Janeiro</p>
      <p><strong>Data:</strong> 15/07/2025</p>
      <p><strong>Horário:</strong> 14:00</p>
    </div>

     <form class="form-reserva">

      <h2>Selecione seu Assento</h2>
      <div class="mapa-assentos">
        <div class="assento">1A</div>
        <div class="assento">1B</div>
        <div class="assento corredor"></div>
        <div class="assento">1C</div>
        <div class="assento">1D</div>

        <div class="assento">2A</div>
        <div class="assento">2B</div>
        <div class="assento corredor"></div>
        <div class="assento">2C</div>
        <div class="assento">2D</div>

        <div class="assento">3A</div>
        <div class="assento">3B</div>
        <div class="assento corredor"></div>
        <div class="assento">3C</div>
        <div class="assento">3D</div>
      </div>

      <h2>Bagagem</h2>
      <div class="form-group">
        <label for="bagagem">Escolha sua bagagem:</label>
        <select id="bagagem" required>
          <option value="">Selecione</option>
          <option>Sem bagagem despachada</option>
          <option>1 Mala de 23kg</option>
          <option>2 Malas de 23kg</option>
          <option>Outros extras</option>
        </select>
      </div>

      <button type="submit">Prosseguir</button>
    </form>
  </div>
</body>
</html>
